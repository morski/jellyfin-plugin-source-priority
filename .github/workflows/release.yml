name: Release plugin
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        run: |
          dotnet run --project tests/Tests.csproj -c Release
          node tests/test-ui.mjs
      - name: Package plugin
        run: python3 scripts/package.py --version "${GITHUB_REF_NAME#v}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --title "Source Priority ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - name: Update repository catalog
        run: |
          git fetch origin main
          git switch -C main origin/main
          python3 scripts/update_catalog.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update plugin catalog for $GITHUB_REF_NAME"
            git push origin main
          fi
